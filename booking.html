<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">🎬 Movie Ticket Booking</h2>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="movies.html">Movies</a></li>
            <li><a href="booking.html">Booking</a></li>
            <li><a href="payment.html">Payment</a></li>
            <li><a href="confirmation.html">Confirmation</a></li>
        </ul>
    </nav>
</header>

<div class="booking">

    <h2>Book Your Tickets</h2>

    <form action="payment.html">

        <label>Select Movie</label>
        <select required>
            <option>Leo</option>
            <option>Bigil</option>
            <option>Mersal</option>
            <option>Dada</option>
            <option>Parasakthi</option>
        </select>

        <label>Select Date</label>
        <input type="date" required>

        <label>Select Show Time</label>
        <select required>
            <option>10:00 AM</option>
            <option>1:30 PM</option>
            <option>5:00 PM</option>
            <option>9:00 PM</option>
        </select>

        <label>Number of Tickets</label>
        <input type="number" min="1" max="10" value="1" required>

        <h3 style="margin-top:25px;color:#FFD700;">Seat Selection</h3>

        <div class="seat-container">

            <div class="seat">A1</div>
            <div class="seat">A2</div>
            <div class="seat">A3</div>
            <div class="seat">A4</div>
            <div class="seat">A5</div>

            <div class="seat">B1</div>
            <div class="seat">B2</div>
            <div class="seat">B3</div>
            <div class="seat">B4</div>
            <div class="seat">B5</div>

            <div class="seat">C1</div>
            <div class="seat">C2</div>
            <div class="seat">C3</div>
            <div class="seat">C4</div>
            <div class="seat">C5</div>

            <div class="seat">D1</div>
            <div class="seat">D2</div>
            <div class="seat">D3</div>
            <div class="seat">D4</div>
            <div class="seat">D5</div>

        </div>

        <br>

        <button class="btn" type="submit">
            Proceed to Payment
        </button>

    </form>

</div>

<footer>
    <p>© 2026 Movie Ticket Booking System | All Rights Reserved</p>
</footer>
<script src="js/script.js"></script>
</body>
</html>
